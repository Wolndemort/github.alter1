name: Deploy ALTER

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: alter-production
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Create CI-only environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          GEMINI_API_KEY=test-key
          OPENROUTER_API_KEY=test-key
          APP_AUTH_SECRET=ci-only-test-secret
          APP_EMAIL_MODE=console
          DB_PASSWORD=postgres
          YOUTUBE_API_KEY=test-key
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/alter_project_db
          EOF

      - name: Run tests
        env:
          BOT_TOKEN: '0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          OPENROUTER_API_KEY: test-key
          GEMINI_API_KEY: test-key
          YOUTUBE_API_KEY: test-key
          APP_AUTH_SECRET: ci-only-test-secret
          APP_EMAIL_MODE: console
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/alter_project_db
        run: python -m pytest -q

      - name: Run mobile checks
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --runInBand

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t alter-ci .

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /root/alter
            git fetch origin master
            git reset --hard origin/master
            chmod +x cicd/deploy.sh
            ./cicd/deploy.sh
            test "$(docker inspect -f '{{.State.Status}}' alter_bot)" = running
            test "$(docker inspect -f '{{.State.Health.Status}}' alter_db_container)" = healthy
            docker compose logs --tail=50 bot
