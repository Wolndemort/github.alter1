server {
    listen 80;
    server_name alterai.ru www.alterai.ru api.alterai.ru;

    # Keep this above the application limit (20 MiB) to allow multipart overhead.
    client_max_body_size 25m;

    root /usr/share/nginx/html;

    # Keep the public URLs short while the files remain grouped in /legal.
    location = /privacy { try_files /legal/privacy.html =404; }
    location = /consent { try_files /legal/consent.html =404; }
    location = /offer { try_files /legal/offer.html =404; }
    location = /refund { try_files /legal/refund.html =404; }

    location = /webhooks/yookassa {
        proxy_pass http://alter_bot:8080/webhooks/yookassa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://alter_bot:8080/health;
    }

    # Independent app API. Telegram polling and its handlers remain separate.
    location /api/ {
        proxy_pass http://alter_bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /legal/privacy { return 301 /privacy; }
    location = /legal/consent { return 301 /consent; }
    location = /legal/offer { return 301 /offer; }
    location = /legal/refund { return 301 /refund; }

    location / {
        try_files $uri $uri/ =404;
    }
}
