server {
    listen 80;
    server_name alterai.ru www.alterai.ru api.alterai.ru;

    # Send logs to Docker's bounded json-file logger instead of allowing
    # unbounded files inside the nginx container layer.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # App accepts files up to 20 MiB; leave room for multipart metadata and
    # high-resolution photos that the mobile client compresses before upload.
    client_max_body_size 100m;

    # Baseline browser security headers. `always` also covers API errors.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    root /usr/share/nginx/html;

    # Keep the public URLs short while the files remain grouped in /legal.
    location = /privacy { try_files /legal/privacy.html =404; }
    location = /consent { try_files /legal/consent.html =404; }
    location = /offer { try_files /legal/offer.html =404; }
    location = /refund { try_files /legal/refund.html =404; }

    # Public SEO pages must return real HTML instead of the authenticated SPA shell.
    location = /faq { try_files /faq.html =404; }
    location = /vozmozhnosti { try_files /vozmozhnosti.html =404; }
    location = /features { return 301 /vozmozhnosti; }

    location = /webhooks/yookassa {
        proxy_pass http://alter_bot:8080/webhooks/yookassa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://alter_bot:8080/health;
    }

    location = /ready {
        proxy_pass http://alter_bot:8080/ready;
    }

    # Independent app API. Telegram polling and its handlers remain separate.
    location /api/ {
        proxy_pass http://alter_bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /legal/privacy { return 301 /privacy; }
    location = /legal/consent { return 301 /consent; }
    location = /legal/offer { return 301 /offer; }
    location = /legal/refund { return 301 /refund; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
