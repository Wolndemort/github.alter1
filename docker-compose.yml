services:
  redis:
    image: redis:7-alpine
    container_name: alter_redis_container
    restart: always
    volumes:
      - redis_data:/data
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    image: pgvector/pgvector:pg15
    container_name: alter_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: alter_project_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging


  bot:
    build: .
    container_name: alter_bot
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/alter_project_db"
      REDIS_URL: "redis://redis:6379/0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - web_network
    logging: *default-logging

  migrations:
    build: .
    container_name: alter_migrations
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/alter_project_db"
    logging: *default-logging

  alter-nginx:
    image: nginx:alpine
    container_name: alter_nginx
    restart: always
    networks:
      - web_network
    volumes:
      - ./nginx.alter.conf:/etc/nginx/conf.d/default.conf:ro
      - ./legal:/usr/share/nginx/html/legal:ro

volumes:
  postgres_data:
  redis_data:

networks:
  web_network:
    external: true
    name: web_network
